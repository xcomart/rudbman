<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    The application mark as the title bar draws it: the cylinder of
    `assets/icon.svg`, reduced to an outline, without that file's tile or
    either of its colours.

    The tile is what makes the shipped icon read on a desktop, and what made it
    disappear in the title bar: its own dark background sat on a dark chrome and
    left only the mark showing. Here the mark is a monochrome sprite the bar
    tints from the theme, so it carries the same contrast as every other icon in
    the row, in every theme. The shipped icon's gold cap goes with the colour —
    one tint means one hue — and survives as the ellipse that makes the outline
    read as a solid seen from above rather than as a rounded rectangle.

    Strokes, not a filled silhouette, and at the 1.9 weight of `tab-list.svg`
    and `new-tab.svg`: those are what it sits beside, and a filled mark among
    hairline glyphs reads as a blot rather than as one of the row.

    The shipped icon's two grooves are dropped rather than scaled down. `main.rs`
    draws this at 16 px, where the stroke is 1.3 px wide, and a groove between
    the cap and the base leaves each gap barely a pixel: the barrel fills in and
    the mark becomes a stack of stripes, heavier than anything else in the row.
    Cap, sides and base alone leave the body clear at that size and still say
    cylinder. Anything added back here has to be checked at 16 px, not at 24.
  -->
  <g fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round">
    <!-- the cap -->
    <ellipse cx="12" cy="6.9" rx="6" ry="2.7"/>
    <!-- the sides -->
    <path d="M6 6.9 V17.1 M18 6.9 V17.1"/>
    <!-- the base closing the barrel -->
    <path d="M6 17.1 A6 2.7 0 0 0 18 17.1"/>
  </g>
</svg>
