[package]
name = "rudbman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "rudbman"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself. That file is generated from
# `assets/icon.svg`; see `assets/README.md`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# `windows` and `raw-window-handle` are used only by `src/caption.rs`, to colour
# the DWM title bar from the app theme. `windows-registry` is used only by
# `src/update.rs`, which rewrites the `DisplayVersion` of the "Apps & features"
# entry the Inno installer left behind, so that a copy which updates itself does
# not go on looking out of date to winget.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-registry.workspace = true
raw-window-handle.workspace = true

[dependencies]
rudbman-core.workspace = true
rudbman-editor.workspace = true
# The ERD canvas. The shell wraps it in `ErdPane`, which owns the loading
# state, the toolbar, the translated strings and the saved layout — everything
# the widget deliberately does not know (architecture document, §7.6).
rudbman-erd.workspace = true
rudbman-grid.workspace = true
rudbman-jdbc.workspace = true
rudbman-sql.workspace = true
rudbman-ssh.workspace = true
rudbman-ui.workspace = true

# `erd/<profile-uuid>.json` is the one file the shell itself persists, so it is
# also the one place here that derives a serializer.
serde.workspace = true
# The explorer and the detail panel read `DESCRIBE` items, which the JNI layer
# hands over as JSON maps: the bridge's key names are fixed and stable across
# drivers, so a map is the right shape and a struct per metadata kind would be
# thirteen of them.
serde_json.workspace = true
# The connection orchestrator runs on a background thread and reports back to
# the window through a one-shot channel, which is what lets a tunnel that dies
# under a live session reach the tab that has to be marked dead.
futures.workspace = true
# The host key verifier the tunnel calls back into is an async trait object.
async-trait.workspace = true
# Guards the tunnel pool, which is reached from every connect thread at once.
parking_lot.workspace = true
# Profile and driver identifiers.
uuid.workspace = true
# Two callers: the driver downloader in `src/maven.rs`, and `src/update.rs`,
# which asks the GitHub releases API for the latest tag and then downloads the
# archive it names. gpui's own `cx.http_client()` is a `NullHttpClient` unless
# the application installs one, and installing a real one to serve two
# background requests would be a much larger dependency. See the note beside
# the entry in the workspace manifest.
ureq.workspace = true
# Only for `src/update.rs`: the SHA-256 the self-updater checks a downloaded
# release asset against. Already linked as the crypto backend of both `russh`
# and `ureq`'s `rustls`, so this is an edge in the graph rather than a crate in
# the build.
ring.workspace = true

# The theme editor's catalogue hands file writes and deletions straight back
# from `rudbman-ui::theme_store`, which reports them as `anyhow::Result`.
anyhow.workspace = true
# The export save dialog falls back to the user's home directory when the
# catalogue's own directory does not exist yet; `rudbman-core` resolves the
# configuration directory but has no reason to expose the home one.
directories.workspace = true
gpui.workspace = true
# One call, in `main`: `gpui_platform::application()`. gpui's core no longer
# knows which windowing backend exists, so the façade is what links one in and
# hands back the `Application` the rest of `main` drives.
gpui_platform.workspace = true
log.workspace = true
env_logger.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true

[dev-dependencies]
# gpui's headless test platform, for the behaviour that only exists once an
# element tree has been laid out. Test-only: the binary links gpui without it.
gpui = { workspace = true, features = ["test-support"] }
# The window-geometry round trip writes a real `settings.json` and reads it
# back, rather than mocking the configuration directory out.
tempfile.workspace = true

