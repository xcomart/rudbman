[package]
name = "rudbman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "rudbman"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself. That file is generated from
# `assets/icon.svg`; see `assets/README.md`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dependencies]
rudbman-core.workspace = true
# The ERD canvas. The shell wraps it in `ErdPane`, which owns the loading
# state, the toolbar, the translated strings and the saved layout — everything
# the widget deliberately does not know (architecture document, §7.6).
rudbman-erd.workspace = true
rudbman-jdbc.workspace = true
rudbman-sql.workspace = true
rudbman-ssh.workspace = true
ruui.workspace = true
# The code editor. It knows no SQL of its own: `src/sql_highlight.rs` is the
# `Highlighter` that hands it `rudbman-sql`'s tokens, which is also what makes
# the dialect a decision this crate takes rather than the widget.
ruui-editor.workspace = true
ruui-grid.workspace = true
# The application shell: the window chrome, the updater and its dialog, the
# about dialog, the split-pane tree, the palette catalogue and its editor, and
# the pieces the settings form is built out of. It is told what rudbman is —
# `ruui_shell::init`, `set_strings` and `set_update_policy`, all three in
# `main` — and knows nothing else about it.
ruui-shell.workspace = true

# `erd/<profile-uuid>.json` is the one file the shell itself persists, so it is
# also the one place here that derives a serializer.
serde.workspace = true
# The explorer and the detail panel read `DESCRIBE` items, which the JNI layer
# hands over as JSON maps: the bridge's key names are fixed and stable across
# drivers, so a map is the right shape and a struct per metadata kind would be
# thirteen of them.
serde_json.workspace = true
# The connection orchestrator runs on a background thread and reports back to
# the window through a one-shot channel, which is what lets a tunnel that dies
# under a live session reach the tab that has to be marked dead.
futures.workspace = true
# The host key verifier the tunnel calls back into is an async trait object.
async-trait.workspace = true
# Guards the tunnel pool, which is reached from every connect thread at once.
parking_lot.workspace = true
# Profile and driver identifiers.
uuid.workspace = true
# One caller: the driver downloader in `src/maven.rs`. gpui's own
# `cx.http_client()` is a `NullHttpClient` unless the application installs one,
# and installing a real one to serve one background request would be a much
# larger dependency. See the note beside the entry in the workspace manifest.
ureq.workspace = true
# The saved ERD layout reports its file errors as `anyhow::Result`, and so does
# the pair of theme directories the shell's catalogues are built over.
anyhow.workspace = true
# The extract and ERD export dialogs fall back to the user's home directory;
# `rudbman-core` resolves the configuration directory but has no reason to
# expose the home one.
directories.workspace = true
gpui.workspace = true
# One call, in `main`: `gpui_platform::application()`. gpui's core no longer
# knows which windowing backend exists, so the façade is what links one in and
# hands back the `Application` the rest of `main` drives.
gpui_platform.workspace = true
log.workspace = true
env_logger.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true

[dev-dependencies]
# gpui's headless test platform, for the behaviour that only exists once an
# element tree has been laid out. Test-only: the binary links gpui without it.
gpui = { workspace = true, features = ["test-support"] }
# The window-geometry round trip writes a real `settings.json` and reads it
# back, rather than mocking the configuration directory out.
tempfile.workspace = true

