[package]
name = "rudbman-jdbc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The only rudbman crate this one knows, and it is read-only: the JVM heap and
# the extra JVM arguments come from `AppSettings`. In particular this crate does
# *not* know `gpui` — it exposes a plain synchronous API and leaves the binding
# to the UI thread to `rudbman-app` (architecture document, §3.1).
rudbman-core.workspace = true

anyhow.workspace = true
jni.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The extraction tests need a directory to write a script into and to have it
# removed again however the test ends.
tempfile.workspace = true
# One test reads a job's progress off `call_raw`, because the typed path needs a
# live `Job` and what it is testing is a job that has been dropped.
serde_json.workspace = true
