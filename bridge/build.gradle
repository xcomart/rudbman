plugins {
    id 'java'
}

group = 'comart.rudbman'
version = '0.1.2'
description = 'rudbman JDBC bridge'

repositories {
    mavenCentral()
}

// No toolchain block on purpose: toolchain resolution can try to provision a JDK
// over the network. The build simply requires an ambient JDK 17+ and pins the
// bytecode level with --release.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

// A configuration nothing compiles or runs against, holding the JDBC drivers
// the *Rust* container tests need.
//
// `crates/rudbman-jdbc/tests/containers.rs` looks for a driver jar the way
// `tests/h2.rs` looks for H2's: in the Gradle cache, under
// `<gradle home>/caches/modules-2/files-2.1/<group>/<artifact>/**`. H2 lands
// there because the bridge's own Java suite really does use it. These two do
// not — no Java test in this project ever loads a PostgreSQL or a MySQL
// driver — so declaring them `testImplementation` would put them on a class
// path with no use for them and say something untrue about this suite. This
// configuration fills the cache without claiming they are part of any build.
configurations {
    drivers
}

dependencies {
    // Gson is the only runtime dependency. Metadata values are arbitrary strings
    // handed to us by drivers (table comments, vendor error messages, control
    // characters) and a hand-rolled serializer gets the escaping wrong exactly
    // there. Version pinned to the one jdbgen already uses.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // See the `drivers` configuration above: for `crates/rudbman-jdbc/tests`,
    // not for anything in `src`.
    drivers 'org.postgresql:postgresql:42.7.4'
    drivers 'com.mysql:mysql-connector-j:9.1.0'
    drivers 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
    drivers 'com.oracle.database.jdbc:ojdbc11:23.6.0.24.10'
    drivers 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'
}

// Resolution *is* the work: a file in the cache is all the Rust tests want.
// The paths are printed so that a developer who would rather point
// RUDBMAN_TEST_PG_JAR / RUDBMAN_TEST_MYSQL_JAR at them by hand can read them
// off, and so that the task says something when it has nothing to download.
tasks.register('drivers') {
    group = 'verification'
    description = 'Downloads the PostgreSQL, MySQL, MariaDB, Oracle, and SQL Server JDBC ' +
        'drivers into the Gradle cache, where the Rust container tests ' +
        '(crates/rudbman-jdbc/tests/containers.rs) find them.'
    def jars = configurations.drivers
    inputs.files jars
    doLast {
        jars.each { println it.absolutePath }
    }
}

// The JVM is booted with -Djava.class.path=<bridge.jar> and nothing else
// (architecture.md 4.1), so Gson has to live inside the jar. A plain merge is
// enough here; no shading plugin is pulled in for one 230KB dependency.
jar {
    archiveFileName = 'rudbman-bridge.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    // The merged jar is an unnamed-module artifact; a stray module descriptor
    // from a dependency would only confuse the module system.
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    manifest {
        attributes(
            'Implementation-Title': 'rudbman-bridge',
            'Implementation-Version': project.version
        )
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
