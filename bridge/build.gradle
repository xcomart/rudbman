plugins {
    id 'java'
}

group = 'comart.rudbman'
version = '0.1.2'
description = 'rudbman JDBC bridge'

repositories {
    mavenCentral()
}

// No toolchain block on purpose: toolchain resolution can try to provision a JDK
// over the network. The build simply requires an ambient JDK 17+ and pins the
// bytecode level with --release.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

// A configuration nothing compiles or runs against, holding the JDBC drivers
// the *Rust* container tests need.
//
// `crates/rudbman-jdbc/tests/containers.rs` looks for a driver jar the way
// `tests/h2.rs` looks for H2's: in the Gradle cache, under
// `<gradle home>/caches/modules-2/files-2.1/<group>/<artifact>/**`. H2 lands
// there because the bridge's own Java suite really does use it. The others are
// not `testImplementation`: the unit suite never loads them, and on its class
// path they would say something untrue about it. This configuration fills the
// cache for the Rust tests, and is the class path of `backupRoundTrip` below,
// the one Java test that talks to the servers.
configurations {
    drivers
    // The Groovy runtime a dialect profile's script runs on
    // (docs/dialect-profiles.md, §5.3). The bridge is compiled without it:
    // the application downloads it from Maven Central and sends its JAR with
    // OPEN_SESSION, and the bridge loads it on a class loader of its own. So
    // it is no dependency of `src`; the tests load it the same way, from the
    // path the `test` task hands them.
    groovyRuntime
}

dependencies {
    // Gson is the only runtime dependency. Metadata values are arbitrary strings
    // handed to us by drivers (table comments, vendor error messages, control
    // characters) and a hand-rolled serializer gets the escaping wrong exactly
    // there. Version pinned to the one jdbgen already uses.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'com.h2database:h2:2.5.252'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // See the `drivers` configuration above: for `crates/rudbman-jdbc/tests`,
    // not for anything in `src`.
    drivers 'org.postgresql:postgresql:42.7.15'
    drivers 'com.mysql:mysql-connector-j:26.10.0'
    drivers 'org.mariadb.jdbc:mariadb-java-client:4.0.0'
    drivers 'com.oracle.database.jdbc:ojdbc11:23.26.4.0.0'
    drivers 'com.microsoft.sqlserver:mssql-jdbc:13.6.2.jre11'
    drivers 'org.xerial:sqlite-jdbc:3.54.1.0'
    drivers 'com.ibm.db2:jcc:12.1.5.0'
    // Firebird's, for the product its shipped dialect profile describes.
    drivers 'org.firebirdsql.jdbc:jaybird:6.0.7'

    // The same coordinate as GROOVY_RUNTIME in crates/rudbman-core/src/dialects.rs,
    // which a test there holds this line to.
    groovyRuntime 'org.apache.groovy:groovy:5.0.8'
}

// Resolution *is* the work: a file in the cache is all the Rust tests want.
// The paths are printed so that a developer who would rather point
// RUDBMAN_TEST_PG_JAR / RUDBMAN_TEST_MYSQL_JAR at them by hand can read them
// off, and so that the task says something when it has nothing to download.
tasks.register('drivers') {
    group = 'verification'
    description = 'Downloads the PostgreSQL, MySQL, MariaDB, Oracle, SQL Server, Db2, and ' +
        'SQLite JDBC drivers, and the Groovy runtime of the dialect-profile suites, into ' +
        'the Gradle cache, where the Rust container tests ' +
        '(crates/rudbman-jdbc/tests/containers.rs) find them.'
    def jars = configurations.drivers + configurations.groovyRuntime
    inputs.files jars
    doLast {
        jars.each { println it.absolutePath }
    }
}

// The JVM is booted with -Djava.class.path=<bridge.jar> and nothing else
// (architecture.md 4.1), so Gson has to live inside the jar. A plain merge is
// enough here; no shading plugin is pulled in for one 230KB dependency.
jar {
    archiveFileName = 'rudbman-bridge.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    // The merged jar is an unnamed-module artifact; a stray module descriptor
    // from a dependency would only confuse the module system.
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    manifest {
        attributes(
            'Implementation-Title': 'rudbman-bridge',
            'Implementation-Version': project.version
        )
    }
}

test {
    useJUnitPlatform()
    // The round trip against real servers is a task of its own, below.
    exclude 'comart/rudbman/bridge/BackupRoundTripTest*'
    // The scripts' tests load Groovy from here, as the bridge does from the
    // path OPEN_SESSION gives it.
    def groovyRuntime = configurations.groovyRuntime
    inputs.files groovyRuntime
    doFirst {
        systemProperty 'rudbman.test.groovy', groovyRuntime.asPath
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// A backup of each product, replayed with the product's own client inside its
// container, has to give the schema back (BackupRoundTripTest). Opt-in like the
// Rust container tests: a product whose RUDBMAN_TEST_*_URL is unset is skipped,
// and H2 and SQLite, which need no server, always run.
tasks.register('backupRoundTrip', Test) {
    group = 'verification'
    description = 'Backs up each test database, restores it with the product\'s own client ' +
        'and compares the two (needs the servers of docker/compose.yml).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + configurations.drivers
    useJUnitPlatform()
    filter {
        includeTestsMatching 'comart.rudbman.bridge.BackupRoundTripTest'
    }
    // The servers, not the inputs, are what a run checks.
    outputs.upToDateWhen { false }
    // MariaDB through a dialect profile runs its script on this Groovy.
    def groovyRuntime = configurations.groovyRuntime
    doFirst {
        systemProperty 'rudbman.test.groovy', groovyRuntime.asPath
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}
