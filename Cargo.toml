[workspace]
resolver = "3"
members = ["crates/*"]
# The `vendor/*` directories are patched dependencies, not members: they keep
# their own manifests and must not inherit workspace settings.
exclude = [
    "vendor/gpui",
    "vendor/gpui_linux",
    "vendor/gpui_macos",
    "vendor/gpui_windows",
]

# gpui comes from a pinned revision of Zed's monorepo rather than from
# crates.io. 0.2.2 is still the newest published version and it predates the
# split of the crate into a platform-independent core (`gpui`), a façade that
# picks a backend at compile time (`gpui_platform`) and the backends themselves
# (`gpui_linux`, `gpui_macos`, `gpui_windows`) — a split every API below is
# written against, so there is no release to fall back to. A revision, never a
# branch: the monorepo's main moves several times a day, and a floating
# dependency would make two checkouts of this repository build different
# applications.
#
# Zed has no answer of its own for the four things listed below, so the crates
# that need one are vendored under `vendor/` and patched back over the git
# source by the `[patch."https://github.com/zed-industries/zed"]` table. Each
# vendored copy is the upstream directory with its manifest flattened —
# `workspace = true` resolved to concrete specifications, sibling crates
# repointed at this same revision, examples and dev-dependencies dropped — and
# every change to the code marked `RULOGMAN PATCH`, so diffing a vendored crate
# against upstream at this revision shows the whole of what we carry. The marker
# keeps the name of the project the trees are shared with: these four
# directories are meant to stay byte-identical with the same four in
# [rulogman](https://github.com/xcomart/rulogman), so a fix found in either
# project moves across as a plain `diff`.
#
#   * `gpui/src/platform.rs`, `gpui/src/window.rs`, `gpui_macos/src/window.rs`
#     and `gpui_windows/src/window.rs` — `set_titlebar_transparent`, which moves
#     an open window between the caption the platform draws and the one the app
#     draws. gpui settles that at window creation and offers no way back;
#     rudbman offers it as a setting, and reopening the window to honour a
#     change would drop every connection and result grid inside it. It has to
#     reach the backends, so it is a `PlatformWindow` method, which is why the
#     core is vendored at all rather than only the two backends that implement
#     it.
#   * `gpui_linux/src/linux/x11/client.rs` — the WM_DELETE_WINDOW handler runs
#     the close callbacks with the client `RefCell` borrowed, and both of them
#     re-enter the application, where anything that reaches the platform borrows
#     that same cell and panics with "already borrowed". Upstream learnt half of
#     it when the crate was split: `close()` now runs outside the borrow, which
#     is what quitting from a window-closed observer — as this app does — needs.
#     `should_close()` did not move, so an `on_should_close` handler is still
#     standing on the trapdoor; this app registers none today, and the patch is
#     what keeps that from being a condition of closing a window.
#   * `gpui_linux/src/linux/x11/window.rs` — `is_transparent` ignores
#     client-side decorations, unlike its Wayland counterpart, so the
#     transparent shadow band around a self-decorated window composited as
#     solid black.
#   * `gpui_linux/src/linux/x11/window.rs` — the X11 backend has no counterpart
#     to the Wayland one's `org_kde_kwin_blur`, so a blurred background
#     appearance did nothing on KDE X11; `update_blur_region` keeps KWin's
#     `_KDE_NET_WM_BLUR_BEHIND_REGION` in step with the window.
#
# `gpui_platform` is taken from git unpatched — it is a hundred lines of
# `cfg`-directed re-exports — but it still has to be named in the patch table's
# sibling crates, because it is what resolves `gpui_linux` and friends.
#
# Moving the revision forward means re-flattening the manifests and replaying
# the marked hunks. Delete a hunk, and then the vendored crate once it holds
# none, whenever upstream grows its own answer.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }
gpui_linux = { path = "vendor/gpui_linux" }
gpui_macos = { path = "vendor/gpui_macos" }
gpui_windows = { path = "vendor/gpui_windows" }

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT"
authors = ["rudbman contributors"]
repository = "https://github.com/xcomart/rudbman"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
parking_lot = "0.12"
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

# --- text buffer: the SQL editor's document ---
# A rope, because the editor has to hold a 100MB extracted script and stay
# responsive: an insert is O(log n) rather than the memmove a `String` would do,
# and line lookups are O(log n) rather than a scan. Two of its indexes are load
# bearing beyond that — `byte_to_line`/`line_to_byte` are what let the syntax
# cache address the buffer by line, and `char_to_utf16_cu`/`utf16_cu_to_char`
# are what make the IME's UTF-16 offsets convertible in O(log n) instead of the
# whole-string walk a flat buffer needs on every composition step. Default
# features are off so that a line break is `\n` or `\r\n` and nothing else: with
# `unicode_lines` a `\u{2028}` inside a string literal would split a line in the
# rope that the SQL lexer does not split, and the two views of the buffer have
# to agree.
ropey = { version = "1.6", default-features = false, features = [
    "cr_lines",
    "simd",
] }
futures = "0.3"
async-trait = "0.1"
bitflags = "2"
tempfile = "3"
libc = "0.2"

# --- HTTP: the driver downloader and the update check ---
# Maven Central and the GitHub releases API are the only hosts rudbman ever
# fetches from, and both are fetched from a background thread that is already
# blocking on a file write — so a synchronous client is the right shape and an
# async runtime would be a second one beside the tunnel's. `ureq` is the
# smallest such client that still speaks TLS. `rustls` is pinned to the `ring`
# provider for the same reason `russh` is: `aws-lc-rs` needs NASM to build on
# Windows. `gzip` is the update check's addition — the GitHub API answers with
# compressed JSON, and without it the body arrives unreadable.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "_ring",
    "gzip",
] }

# --- SHA-256, for the self-updater.  The GitHub releases API publishes a
# `digest` field for every asset, and an updater that overwrites its own
# installation should check it.  `ring` is already in the tree twice over — it
# is the crypto backend both `russh` and `ureq`'s `rustls` resolve to — so
# naming it directly adds a dependency edge and not a crate: the version below
# is the one the lockfile already pins for them. ---
ring = "0.17"

# --- localization ---
# `rust-i18n` compiles `crates/rudbman-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`.
rust-i18n = "4"
sys-locale = "0.3"

# --- GUI: Zed's GPU-accelerated UI framework ---
# Two crates, one revision, and the revision has to be spelled out in both: a
# git dependency is identified by URL *and* revision, so naming the same commit
# twice is what makes them one source rather than two checkouts of the same
# repository. See the patch table at the top of this file for why a revision at
# all, and for what `vendor/` puts back on top of it.
#
# `gpui` is the platform-independent core, and everything the application
# writes is against it. `gpui_platform` is the façade that links a backend in
# and starts it — `application()` where 0.2.2 had `Application::new()`. Its
# features are empty by default and the backend inherits them, so the two
# display servers Linux might be running under have to be asked for by name;
# `font-kit` is macOS's text stack and is inert elsewhere.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", features = [
    "font-kit",
    "wayland",
    "x11",
] }

# --- platform window chrome, and one platform registry ---
# All four are used by `rudbman-app` alone, and every one of them only under a
# `[target.'cfg(...)']` section, so a build for another platform never sees
# them.
#
# `winresource` embeds `assets/icon.ico` into the Windows executable at
# resource ID 1, which is the id gpui's Windows backend loads for the window
# class icon. `windows` is what `src/caption.rs` pins the native caption to the
# app theme with, pinned to the version gpui already links (0.61) so the
# bindings are shared rather than duplicated in the tree; `raw-window-handle` is
# how gpui hands out the `HWND` it needs. Nothing here is wanted on macOS any
# more: gpui now overrides the `NSAppearance` itself, so that half of
# `src/caption.rs` is a single call into gpui rather than a shim of its own.
#
# `windows-registry` is the one registry consumer in the tree: after a
# self-update `src/update.rs` corrects the `DisplayVersion` in the uninstall
# entry the Inno installer wrote, so that winget still recognises the installed
# copy. It is picked over `winreg` for the same reason as `windows` above — gpui
# already links this exact crate at this exact version, so it costs an edge in
# the dependency graph rather than a crate in the build, whereas `winreg`
# appears today only as a *build*-dependency of `embed-resource` and would drag
# a second registry binding, and its own `windows-sys`, into the linked binary.
winresource = "0.1"
windows = { version = "0.61", features = ["Win32_Graphics_Dwm"] }
windows-registry = "0.5"
raw-window-handle = "0.6"

# --- async runtime (SSH tunnel only) ---
# The tunnel is the only thing here that speaks a network protocol of its own.
# `net` and `io-util` carry the forwarded sockets, `sync` the shutdown signal;
# there is no `fs`, because nothing this transport does touches a file.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- JNI: the JDBC bridge.  `invocation` is what lets the process create its
# own JVM rather than be loaded into one. ---
jni = { version = "0.22", features = ["invocation"] }

# --- internal crates ---
rudbman-core = { path = "crates/rudbman-core" }
rudbman-ui = { path = "crates/rudbman-ui" }
rudbman-ssh = { path = "crates/rudbman-ssh" }
rudbman-jdbc = { path = "crates/rudbman-jdbc" }
rudbman-grid = { path = "crates/rudbman-grid" }
rudbman-erd = { path = "crates/rudbman-erd" }
rudbman-sql = { path = "crates/rudbman-sql" }
rudbman-editor = { path = "crates/rudbman-editor" }
rudbman-app = { path = "crates/rudbman-app" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
