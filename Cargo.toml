[workspace]
resolver = "3"
members = ["crates/*"]

# gpui comes from a pinned revision of Zed's monorepo rather than from
# crates.io. 0.2.2 is still the newest published version and it predates the
# split of the crate into a platform-independent core (`gpui`), a façade that
# picks a backend at compile time (`gpui_platform`) and the backends themselves
# (`gpui_linux`, `gpui_macos`, `gpui_windows`) — a split every API below is
# written against, so there is no release to fall back to. A revision, never a
# branch: the monorepo's main moves several times a day, and a floating
# dependency would make two checkouts of this repository build different
# applications.
#
# Zed has no answer of its own for five things rudbman needs — moving an open
# window between the platform's caption and the application's own
# (`set_titlebar_transparent`), the X11 backend running its close callbacks with
# the client `RefCell` borrowed, X11's `is_transparent` ignoring client-side
# decorations, X11 having no counterpart to Wayland's `org_kde_kwin_blur`, and
# macOS 26 blurring nothing behind a window whose `NSVisualEffectView` Liquid
# Glass rebuilt — so four crates of the monorepo are carried patched. rudbman
# no longer carries them itself: [rugpui](https://github.com/xcomart/rugpui),
# the widget kit the editor and the grid come from, vendors them under
# `vendor/` and its root manifest tells the whole story hunk by hunk. What
# rudbman has to do is point its own patch table at that same copy, because
# otherwise this workspace resolves gpui from Zed's monorepo while `rugpui`
# resolves it from the patched one, two gpui crates end up in one binary, and
# the `Global`s the widgets install are invisible to the application.
#
# `gpui_platform` is taken from git unpatched — it is a hundred lines of
# `cfg`-directed re-exports — but it still has to be named in the patch table's
# sibling crates, because it is what resolves `gpui_linux` and friends.
#
# The four entries below, and the four `rugpui` dependencies further down, are
# `git`+`rev` dependencies on `https://github.com/xcomart/rugpui`, in the form
# rugpui's own README spells out — all eight at the *same* revision, for the
# reason in the paragraph above. Bumping the revision means bumping all eight
# together; letting them drift apart is exactly the two-copies-of-gpui bug
# this table exists to avoid.
#
# Working on rugpui locally: rather than editing eight revisions by hand, point
# these at a sibling checkout by adding a `[patch."https://github.com/xcomart/rugpui"]`
# table with `path = "../rugpui/crates/rugpui"` (and its `rugpui-grid`, `rugpui-editor`,
# `rugpui-shell` and `vendor/gpui*` siblings) to `.cargo/config.toml`, which is
# not committed.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }
gpui_linux = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }
gpui_macos = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }
gpui_windows = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["rudbman contributors"]
repository = "https://github.com/xcomart/rudbman"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
parking_lot = "0.12"
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

# --- text buffer: the SQL editor's document ---
# A rope, because the editor has to hold a 100MB extracted script and stay
# responsive: an insert is O(log n) rather than the memmove a `String` would do,
# and line lookups are O(log n) rather than a scan. Two of its indexes are load
# bearing beyond that — `byte_to_line`/`line_to_byte` are what let the syntax
# cache address the buffer by line, and `char_to_utf16_cu`/`utf16_cu_to_char`
# are what make the IME's UTF-16 offsets convertible in O(log n) instead of the
# whole-string walk a flat buffer needs on every composition step. Default
# features are off so that a line break is `\n` or `\r\n` and nothing else: with
# `unicode_lines` a `\u{2028}` inside a string literal would split a line in the
# rope that the SQL lexer does not split, and the two views of the buffer have
# to agree.
ropey = { version = "1.6", default-features = false, features = [
    "cr_lines",
    "simd",
] }
futures = "0.3"
async-trait = "0.1"
bitflags = "2"
tempfile = "3"
libc = "0.2"

# --- HTTP: the driver downloader, and the shell's update check ---
# Maven Central and the GitHub releases API are the only hosts rudbman ever
# fetches from, and both are fetched from a background thread that is already
# blocking on a file write — so a synchronous client is the right shape and an
# async runtime would be a second one beside the tunnel's. `ureq` is the
# smallest such client that still speaks TLS. The releases API is
# `rugpui-shell`'s caller now; the entry stays here because the workspace still
# resolves it for the driver downloader, and because the shell resolves the
# same crate through this workspace's lock. `rustls` is pinned to the `ring`
# provider for the same reason `russh` is: `aws-lc-rs` needs NASM to build on
# Windows. `gzip` is the update check's addition — the GitHub API answers with
# compressed JSON, and without it the body arrives unreadable.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "_ring",
    "gzip",
] }

# --- SHA-256, for `rugpui-shell`'s self-updater.  The GitHub releases API
# publishes a `digest` field for every asset, and an updater that overwrites its
# own installation should check it.  No crate of this workspace names `ring`
# any more — the shell does — but it is already in the tree twice over as the
# crypto backend both `russh` and `ureq`'s `rustls` resolve to, so this entry
# only pins the version they and the shell share. ---
ring = "0.17"

# --- localization ---
# `rust-i18n` compiles `crates/rudbman-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`.
rust-i18n = "4"
sys-locale = "0.3"

# --- GUI: Zed's GPU-accelerated UI framework ---
# Two crates, one revision, and the revision has to be spelled out in both: a
# git dependency is identified by URL *and* revision, so naming the same commit
# twice is what makes them one source rather than two checkouts of the same
# repository. See the patch table at the top of this file for why a revision at
# all, and for what rugpui's vendored copy puts back on top of it.
#
# `gpui` is the platform-independent core, and everything the application
# writes is against it. `gpui_platform` is the façade that links a backend in
# and starts it — `application()` where 0.2.2 had `Application::new()`. Its
# features are empty by default and the backend inherits them, so the two
# display servers Linux might be running under have to be asked for by name;
# `font-kit` is macOS's text stack and is inert elsewhere.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", features = [
    "font-kit",
    "wayland",
    "x11",
] }

# --- platform window chrome, and one platform registry ---
# All four are used by `rudbman-app` alone, and every one of them only under a
# `[target.'cfg(...)']` section, so a build for another platform never sees
# them.
#
# `winresource` embeds `assets/icon.ico` into the Windows executable at
# resource ID 1, which is the id gpui's Windows backend loads for the window
# class icon, and it is the one of the four `rudbman-app` still names itself.
#
# The other three are `rugpui-shell`'s: `windows` is what its caption code pins
# the DWM title bar to the app theme with, `raw-window-handle` is how gpui hands
# out the `HWND` that needs, and `windows-registry` is what corrects the
# `DisplayVersion` of the "Apps & features" entry after a self-update. All three
# are pinned here to the versions gpui already links, so they cost an edge in
# the dependency graph rather than a crate in the build — which is also why
# `windows-registry` is picked over `winreg`, whose own `windows-sys` would be a
# second registry binding in the linked binary.
winresource = "0.1"
windows = { version = "0.61", features = ["Win32_Graphics_Dwm"] }
windows-registry = "0.5"
raw-window-handle = "0.6"

# --- async runtime (SSH tunnel only) ---
# The tunnel is the only thing here that speaks a network protocol of its own.
# `net` and `io-util` carry the forwarded sockets, `sync` the shutdown signal;
# there is no `fs`, because nothing this transport does touches a file.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- JNI: the JDBC bridge.  `invocation` is what lets the process create its
# own JVM rather than be loaded into one. ---
jni = { version = "0.22", features = ["invocation"] }

# --- the shared widget kit, and the shell above it ---
# The gpui widget kit, the virtualised grid and the code editor, extracted so
# that the three desktop applications built on them stop carrying
# byte-identical copies. Nothing there knows what a database is: the editor is
# handed a `Highlighter` (`crates/rudbman-app/src/sql_highlight.rs` is
# rudbman's, over `rudbman-sql`) and the grid a `GridSource`.
#
# `rugpui-shell` is the layer *above* the widgets, and it is here for the same
# reason: the window that draws its own title bar, the self-updater, the about
# and update dialogs, the split-pane tree, the palette editor and the pieces a
# settings form is built out of had each been written once here and copied
# twice. It knows nothing about rudbman either — the name, the version, the
# release endpoints, the words and the ignored-release tag are injected by
# `main` at start-up.
#
# The same `rev` of `https://github.com/xcomart/rugpui` as the patch table at
# the top of this file, which is what keeps one gpui in the binary.
rugpui = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }
rugpui-grid = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }
rugpui-editor = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }
rugpui-shell = { git = "https://github.com/xcomart/rugpui", rev = "bd8acab1fe8b6d2c611bf737c710708862f70177" }

# --- internal crates ---
rudbman-core = { path = "crates/rudbman-core" }
rudbman-ssh = { path = "crates/rudbman-ssh" }
rudbman-jdbc = { path = "crates/rudbman-jdbc" }
rudbman-erd = { path = "crates/rudbman-erd" }
rudbman-sql = { path = "crates/rudbman-sql" }
rudbman-app = { path = "crates/rudbman-app" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
