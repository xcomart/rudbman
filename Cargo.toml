[workspace]
resolver = "3"
members = ["crates/*"]
# The `vendor/*` directories are patched dependencies, not members: they keep
# their own manifests and must not inherit workspace settings.
exclude = ["vendor/gpui", "vendor/proc-macro-error2"]

# The vendored gpui carries logman's patches, byte for byte. They are marked
# `LOGMAN PATCH` and must keep that marker: the two vendored trees are meant to
# stay identical so a fix found in either project can be moved across with a
# plain `diff`. Six sites, and every one of them is a crash or a hang:
#
#   * `platform/windows/platform.rs` + `platform/windows/events.rs` — gpui's
#     Windows message loop never calls `TranslateMessage`; it fabricates a
#     `MSG` and translates it re-entrantly from inside the window procedure.
#     TSF depends on the documented loop order, and the violation leaves CTF
#     regenerating `WM_IME_COMPOSITION` forever from inside a `GetMessageW`
#     callback — the process pins a core at 100% and never recovers. Korean IME
#     reaches it by ending a composition mid-word (the Han/Yeong key) and
#     typing on.
#   * `platform/linux/x11/client.rs` — the WM_DELETE_WINDOW close callback ran
#     while the client `RefCell` was held, so an app that quits from its
#     window-closed observer re-entered the borrow and panicked on every close
#     of the last window.
#   * `platform/linux/x11/window.rs` — `request_decorations` invoked the
#     appearance-changed callback synchronously while `handle_input` held the
#     window callbacks `RefCell`; `is_transparent` ignored client-side
#     decorations, so the shadow band composited as solid black; and the X11
#     backend had no counterpart to Wayland's `org_kde_kwin_blur`, so
#     `update_blur_region` now keeps KWin's `_KDE_NET_WM_BLUR_BEHIND_REGION` in
#     step with the window.
#   * `taffy.rs` — explicit `f32` suffixes where bare literals relied on
#     inference that a newer rustc no longer performs.
#
# crates.io has no newer gpui (0.2.2 is current), so vendoring is the only
# route. Delete these patches and `vendor/gpui` once a release carries them.
#
# proc-macro-error2 2.0.1 (pulled in by gpui through stacksafe 0.1) re-exports
# the private `extern crate proc_macro`, which E0365 is phasing out — every
# build prints a future-incompatibility report for it, and a future rustc will
# refuse the crate outright. Upstream has published no fixed release, so
# `vendor/proc-macro-error2` carries the compiler's own suggested one-line fix
# (`pub extern crate`), marked `LOGMAN PATCH` in `src/lib.rs`. Delete the patch
# and the vendor directory when either end moves: a proc-macro-error2 release
# with the fix, or a gpui whose stacksafe (1.x drops the dependency, but its
# API is not a drop-in for gpui 0.2.2) no longer needs it.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"
authors = ["rudbman contributors"]
repository = "https://github.com/xcomart/rudbman"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
parking_lot = "0.12"
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

# --- text buffer: the SQL editor's document ---
# A rope, because the editor has to hold a 100MB extracted script and stay
# responsive: an insert is O(log n) rather than the memmove a `String` would do,
# and line lookups are O(log n) rather than a scan. Two of its indexes are load
# bearing beyond that — `byte_to_line`/`line_to_byte` are what let the syntax
# cache address the buffer by line, and `char_to_utf16_cu`/`utf16_cu_to_char`
# are what make the IME's UTF-16 offsets convertible in O(log n) instead of the
# whole-string walk a flat buffer needs on every composition step. Default
# features are off so that a line break is `\n` or `\r\n` and nothing else: with
# `unicode_lines` a `\u{2028}` inside a string literal would split a line in the
# rope that the SQL lexer does not split, and the two views of the buffer have
# to agree.
ropey = { version = "1.6", default-features = false, features = [
    "cr_lines",
    "simd",
] }
futures = "0.3"
async-trait = "0.1"
bitflags = "2"
tempfile = "3"
libc = "0.2"

# --- HTTP: the driver downloader and the update check ---
# Maven Central and the GitHub releases API are the only hosts rudbman ever
# fetches from, and both are fetched from a background thread that is already
# blocking on a file write — so a synchronous client is the right shape and an
# async runtime would be a second one beside the tunnel's. `ureq` is the
# smallest such client that still speaks TLS. `rustls` is pinned to the `ring`
# provider for the same reason `russh` is: `aws-lc-rs` needs NASM to build on
# Windows. `gzip` is the update check's addition — the GitHub API answers with
# compressed JSON, and without it the body arrives unreadable.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "_ring",
    "gzip",
] }

# --- SHA-256, for the self-updater.  The GitHub releases API publishes a
# `digest` field for every asset, and an updater that overwrites its own
# installation should check it.  `ring` is already in the tree twice over — it
# is the crypto backend both `russh` and `ureq`'s `rustls` resolve to — so
# naming it directly adds a dependency edge and not a crate: the version below
# is the one the lockfile already pins for them. ---
ring = "0.17"

# --- localization ---
# `rust-i18n` compiles `crates/rudbman-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`.
rust-i18n = "4"
sys-locale = "0.3"

# --- GUI: Zed's GPU-accelerated UI framework ---
gpui = "0.2.2"

# --- platform window chrome, and one platform registry ---
# All five are used by `rudbman-app` alone, and every one of them only under a
# `[target.'cfg(...)']` section, so a build for another platform never sees
# them.
#
# `winresource` embeds `assets/icon.ico` into the Windows executable at
# resource ID 1, which is the id gpui's Windows backend loads for the window
# class icon. `windows` and `objc` are what `src/caption.rs` pins the native
# caption to the app theme with; both are pinned to the version gpui already
# links (0.61 and 0.2 respectively) so the bindings and the Objective-C runtime
# shim are shared rather than duplicated in the tree. `raw-window-handle` is how
# gpui hands out the `HWND` and the `NSView` those two need.
#
# `windows-registry` is the one registry consumer in the tree: after a
# self-update `src/update.rs` corrects the `DisplayVersion` in the uninstall
# entry the Inno installer wrote, so that winget still recognises the installed
# copy. It is picked over `winreg` for the same reason as `windows` above — gpui
# already links this exact crate at this exact version, so it costs an edge in
# the dependency graph rather than a crate in the build, whereas `winreg`
# appears today only as a *build*-dependency of `embed-resource` and would drag
# a second registry binding, and its own `windows-sys`, into the linked binary.
winresource = "0.1"
windows = { version = "0.61", features = ["Win32_Graphics_Dwm"] }
windows-registry = "0.5"
raw-window-handle = "0.6"
objc = "0.2"

# --- async runtime (SSH tunnel only) ---
# The tunnel is the only thing here that speaks a network protocol of its own.
# `net` and `io-util` carry the forwarded sockets, `sync` the shutdown signal;
# there is no `fs`, because nothing this transport does touches a file.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- JNI: the JDBC bridge.  `invocation` is what lets the process create its
# own JVM rather than be loaded into one. ---
jni = { version = "0.22", features = ["invocation"] }

# --- internal crates ---
rudbman-core = { path = "crates/rudbman-core" }
rudbman-ui = { path = "crates/rudbman-ui" }
rudbman-ssh = { path = "crates/rudbman-ssh" }
rudbman-jdbc = { path = "crates/rudbman-jdbc" }
rudbman-grid = { path = "crates/rudbman-grid" }
rudbman-erd = { path = "crates/rudbman-erd" }
rudbman-sql = { path = "crates/rudbman-sql" }
rudbman-editor = { path = "crates/rudbman-editor" }
rudbman-app = { path = "crates/rudbman-app" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
